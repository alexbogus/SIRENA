services:
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    network_mode: host
    volumes:
      - ./dashboard/data:/app/data
      - ./dashboard/logs:/app/logs
    environment:
      - PIPER_URL=http://127.0.0.1:5100/synthesize
      - LOG_LEVEL=INFO
    restart: unless-stopped
    depends_on:
      - piper

  piper:
    build:
      context: ./piper
    # Sin network_mode: host y publicado solo en loopback: piper no debe
    # ser alcanzable desde la LAN/exterior ni desde otros contenedores del
    # host, solo desde dashboard (que sí usa host network y comparte el
    # loopback del host).
    ports:
      - "127.0.0.1:5100:5100"
    volumes:
      - ./piper/voices:/voices:ro
    environment:
      - PIPER_VOICE_MODEL=/voices/es_ES-davefx-medium.onnx
    restart: unless-stopped
