services:
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    network_mode: host
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      # Tonos de preámbulo subidos desde /settings: sin este volumen se
      # pierden en cada rebuild/redeploy del contenedor (capa writable
      # efímera) aunque la fila en la tabla `tones` sí persista en ./data.
      - ./audio:/app/static/audio/tones
      # Compartido con piper: el dashboard descarga/elimina modelos de voz
      # aquí directamente (ver /settings -> "Modelos de voz"), piper solo
      # los lee de forma perezosa. Así piper no necesita salida a internet.
      - ./voices:/voices
      # CHANGELOG.md vive en la raíz del repo (fuera del build context, que
      # es docker/) para que GitHub lo muestre de forma estándar y quede
      # junto al README -- se monta de solo lectura para que el sidebar
      # (ver services/changelog.py) lo lea en caliente, sin rebuild.
      - ../CHANGELOG.md:/app/CHANGELOG.md:ro
      # Copias de seguridad de la base de datos: update.sh (en el host) y
      # /settings (dentro del contenedor) leen/escriben la misma carpeta.
      - ./backups:/app/backups
    environment:
      - PIPER_URL=http://127.0.0.1:5100/synthesize
      - PIPER_VOICES_DIR=/voices
      - LOG_LEVEL=INFO
    restart: unless-stopped
    depends_on:
      - piper

  piper:
    build:
      context: ./piper
    # Sin network_mode: host y publicado solo en loopback: piper no debe
    # ser alcanzable desde la LAN/exterior ni desde otros contenedores del
    # host, solo desde dashboard (que sí usa host network y comparte el
    # loopback del host).
    ports:
      - "127.0.0.1:5100:5100"
    volumes:
      - ./voices:/voices
    environment:
      - PIPER_VOICE_MODEL=/voices/es_ES-davefx-medium.onnx
    restart: unless-stopped
