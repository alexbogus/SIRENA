{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-16 bg-slate-900 border border-slate-800 rounded-xl p-6">
    <div class="flex items-center gap-2 mb-6 justify-center">
        <i data-lucide="radio-tower" class="w-6 h-6 text-emerald-400"></i>
        <h1 class="text-xl font-semibold">CECOM - Megafonía IP</h1>
    </div>
    <form method="post" class="space-y-4">
        <div>
            <label class="block text-sm text-slate-400 mb-1">Contraseña</label>
            <input type="password" name="password" autofocus required
                   class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 rounded-lg py-2 font-medium">
            Entrar
        </button>
    </form>
</div>
{% endblock %}
