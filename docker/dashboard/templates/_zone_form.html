{% set editing = z is defined and z %}
<form method="post" action="{{ url_for('zones.edit', zone_id=z.id) if editing else url_for('zones.create') }}" class="space-y-3">
    <div>
        <label class="block text-xs text-slate-400 mb-1">Nombre de la zona</label>
        <input name="name" value="{{ z.name if editing else '' }}" required
               class="w-full bg-navy-800 border border-white/10 rounded-lg px-3 py-2">
    </div>
    <button class="btn-brand px-4 py-2 text-sm">
        {{ 'Guardar cambios' if editing else 'Crear zona' }}
    </button>
</form>
