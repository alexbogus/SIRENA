{% extends "base.html" %}
{% block title %}Altavoces{% endblock %}
{% block content %}
<h1 class="text-xl font-semibold mb-4">Altavoces</h1>

<div class="bg-slate-900 border border-slate-800 rounded-xl p-4 mb-6">
    <h2 class="font-medium mb-3 flex items-center gap-2"><i data-lucide="plus-circle" class="w-4 h-4"></i> Añadir altavoz</h2>
    <form method="post" action="{{ url_for('speakers.create') }}" class="grid sm:grid-cols-4 gap-3 items-end">
        <div>
            <label class="block text-xs text-slate-400 mb-1">Nombre</label>
            <input name="name" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2">
        </div>
        <div>
            <label class="block text-xs text-slate-400 mb-1">IP</label>
            <input name="ip" required placeholder="10.0.1.56" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2">
        </div>
        <div>
            <label class="block text-xs text-slate-400 mb-1">Puerto</label>
            <input name="port" type="number" value="5005" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2">
        </div>
        <div>
            <label class="block text-xs text-slate-400 mb-1">Zonas</label>
            <select name="zone_ids" multiple class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 h-10">
                {% for z in zones %}<option value="{{ z.id }}">{{ z.name }}</option>{% endfor %}
            </select>
        </div>
        <div class="sm:col-span-4">
            <button class="bg-emerald-600 hover:bg-emerald-500 rounded-lg px-4 py-2 text-sm font-medium">Añadir</button>
        </div>
    </form>
</div>

<div class="space-y-3">
    {% for sp in speakers %}
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
        <form method="post" action="{{ url_for('speakers.edit', speaker_id=sp.id) }}" class="grid sm:grid-cols-5 gap-3 items-end">
            <div>
                <label class="block text-xs text-slate-400 mb-1">Nombre</label>
                <input name="name" value="{{ sp.name }}" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">IP</label>
                <input name="ip" value="{{ sp.ip }}" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Puerto</label>
                <input name="port" type="number" value="{{ sp.port }}" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Zonas</label>
                <select name="zone_ids" multiple class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 h-10">
                    {% for z in zones %}
                    <option value="{{ z.id }}" {{ 'selected' if z.id in sp.zones|map(attribute='id')|list else '' }}>{{ z.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="flex gap-2">
                <button class="bg-slate-700 hover:bg-slate-600 rounded-lg px-3 py-2 text-sm">Guardar</button>
            </div>
        </form>
        <form method="post" action="{{ url_for('speakers.delete', speaker_id=sp.id) }}" class="mt-2"
              onsubmit="return confirm('¿Eliminar este altavoz?');">
            <button class="text-red-400 hover:text-red-300 text-xs flex items-center gap-1">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Eliminar
            </button>
        </form>
    </div>
    {% else %}
    <p class="text-slate-500 text-sm">No hay altavoces dados de alta todavía.</p>
    {% endfor %}
</div>
{% endblock %}
