{% extends "base.html" %}
{% block title %}Histórico de mensajes{% endblock %}
{% block content %}
<div class="flex flex-wrap items-center justify-between gap-3 mb-4">
    <h1 class="text-xl font-semibold">Histórico de mensajes enviados</h1>
    <input type="search" id="history-search" placeholder="Buscar por altavoz, zona o texto…"
           class="input input-sm bg-navy-900 border-navy-700 text-slate-100 placeholder:text-slate-500 w-full sm:w-72">
</div>

<div class="overflow-x-auto">
<table class="w-full text-sm bg-navy-900 border border-navy-800 rounded-xl overflow-hidden">
    <thead class="bg-navy-800 text-slate-400 text-left">
        <tr>
            <th class="sort-col cursor-pointer select-none px-3 py-2" data-col="sent_at">Fecha <span class="sort-arrow"></span></th>
            <th class="sort-col cursor-pointer select-none px-3 py-2" data-col="speaker_name">Altavoz <span class="sort-arrow"></span></th>
            <th class="sort-col cursor-pointer select-none px-3 py-2" data-col="target_label">Zona <span class="sort-arrow"></span></th>
            <th class="sort-col cursor-pointer select-none px-3 py-2" data-col="source">Origen <span class="sort-arrow"></span></th>
            <th class="sort-col cursor-pointer select-none px-3 py-2" data-col="text">Mensaje <span class="sort-arrow"></span></th>
            <th class="sort-col cursor-pointer select-none px-3 py-2" data-col="delivery_status">Entrega <span class="sort-arrow"></span></th>
        </tr>
    </thead>
    <tbody id="history-body"></tbody>
</table>
</div>
{% endblock %}

{% block scripts %}
<script>
const allEntries = {{ entries | tojson }};

function deliveryBadge(status) {
    if (status === "confirmed") return `<span class="text-emerald-400">✓ confirmado</span>`;
    if (status === "unconfirmed") return `<span class="text-red-400">✗ no confirmado</span>`;
    return `<span class="text-slate-500">… verificando</span>`;
}

function parseEsDate(s) {
    const m = /^(\d{2})\/(\d{2})\/(\d{4}) - (\d{2}):(\d{2}):(\d{2})$/.exec(s || "");
    if (!m) return 0;
    return new Date(m[3], m[2] - 1, m[1], m[4], m[5], m[6]).getTime();
}

let sortState = {col: "sent_at", dir: "desc"};
let query = "";

function filterEntries(entries) {
    const q = query.trim().toLowerCase();
    if (!q) return entries;
    return entries.filter(e =>
        (e.speaker_name || "").toLowerCase().includes(q) ||
        (e.target_label || "").toLowerCase().includes(q) ||
        (e.text || "").toLowerCase().includes(q)
    );
}

function sortEntries(entries, col, dir) {
    const sorted = [...entries];
    sorted.sort((a, b) => {
        let av = a[col], bv = b[col];
        if (col === "sent_at") { av = parseEsDate(av); bv = parseEsDate(bv); }
        else { av = (av || "").toLowerCase(); bv = (bv || "").toLowerCase(); }
        if (av < bv) return dir === "asc" ? -1 : 1;
        if (av > bv) return dir === "asc" ? 1 : -1;
        return 0;
    });
    return sorted;
}

function render() {
    const tbody = document.getElementById("history-body");
    const rows = sortEntries(filterEntries(allEntries), sortState.col, sortState.dir);
    tbody.innerHTML = "";
    rows.forEach(e => {
        const tr = document.createElement("tr");
        tr.className = "border-t border-navy-800";
        tr.innerHTML = `
            <td class="px-3 py-2 text-xs text-slate-400 whitespace-nowrap">${e.sent_at}</td>
            <td class="px-3 py-2 text-xs">${e.speaker_name}</td>
            <td class="px-3 py-2 text-xs">${e.target_label}</td>
            <td class="px-3 py-2 text-xs text-slate-400">${e.source}</td>
            <td class="px-3 py-2 text-xs max-w-md truncate" title="${e.text.replace(/"/g, '&quot;')}">${e.text}</td>
            <td class="px-3 py-2 text-xs">${deliveryBadge(e.delivery_status)}</td>
        `;
        tbody.appendChild(tr);
    });
    if (rows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="px-3 py-6 text-center text-slate-500">Sin mensajes que coincidan con la búsqueda.</td></tr>`;
    }
    document.querySelectorAll(".sort-col").forEach(th => {
        const arrow = th.querySelector(".sort-arrow");
        arrow.textContent = th.dataset.col === sortState.col ? (sortState.dir === "asc" ? "▲" : "▼") : "";
    });
}

document.querySelectorAll(".sort-col").forEach(th => {
    th.addEventListener("click", () => {
        const col = th.dataset.col;
        sortState = {col, dir: sortState.col === col && sortState.dir === "asc" ? "desc" : "asc"};
        render();
    });
});

document.getElementById("history-search").addEventListener("input", (e) => {
    query = e.target.value;
    render();
});

render();
</script>
{% endblock %}
