{% extends "base.html" %}
{% block title %}Histórico de mensajes{% endblock %}
{% block content %}
<div class="flex flex-wrap items-center justify-between gap-3 mb-4">
    <div>
        <div class="eyebrow">HISTÓRICO DE MENSAJES</div>
        <h1 class="text-2xl font-semibold tracking-tight">Histórico de mensajes enviados</h1>
    </div>
    <input type="search" id="history-search" placeholder="Buscar por altavoz, zona o texto…"
           class="input input-sm bg-navy-900 border-white/10 text-slate-100 placeholder:text-slate-500 w-full sm:w-72">
</div>

<div class="overflow-x-auto">
<table class="w-full text-sm bg-navy-900 border border-white/10 rounded-xl overflow-hidden">
    <thead class="bg-navy-900/60 text-slate-400 text-left border-b border-white/10">
        <tr>
            <th class="sort-col cursor-pointer select-none px-3 py-2" data-col="sent_at">Fecha <span class="sort-arrow"></span></th>
            <th class="sort-col cursor-pointer select-none px-3 py-2" data-col="speaker_name">Altavoz <span class="sort-arrow"></span></th>
            <th class="sort-col cursor-pointer select-none px-3 py-2" data-col="target_label">Zona <span class="sort-arrow"></span></th>
            <th class="sort-col cursor-pointer select-none px-3 py-2" data-col="source">Origen <span class="sort-arrow"></span></th>
            <th class="sort-col cursor-pointer select-none px-3 py-2" data-col="text">Mensaje <span class="sort-arrow"></span></th>
            <th class="sort-col cursor-pointer select-none px-3 py-2" data-col="delivery_status">Entrega <span class="sort-arrow"></span></th>
            <th class="px-3 py-2">Acciones</th>
        </tr>
    </thead>
    <tbody id="history-body" class="divide-y divide-white/5"></tbody>
</table>
</div>
{% endblock %}

{% block scripts %}
<script>
const allEntries = {{ entries | tojson }};

// deliveryBadge(), parseEsDate() y sortHistory() vienen de
// static/js/history-table.js (compartido con dashboard.html).

let sortState = {col: "sent_at", dir: "desc"};
let query = "";

function filterEntries(entries) {
    const q = query.trim().toLowerCase();
    if (!q) return entries;
    return entries.filter(e =>
        (e.speaker_name || "").toLowerCase().includes(q) ||
        (e.target_label || "").toLowerCase().includes(q) ||
        (e.text || "").toLowerCase().includes(q)
    );
}

function render() {
    const tbody = document.getElementById("history-body");
    const rows = sortHistory(filterEntries(allEntries), sortState.col, sortState.dir);
    tbody.innerHTML = "";
    rows.forEach(e => {
        const tr = document.createElement("tr");
        tr.className = "hover:bg-navy-850/40";
        tr.innerHTML = `
            <td class="px-3 py-2 text-xs text-slate-400 tnum whitespace-nowrap">${e.sent_at}</td>
            <td class="px-3 py-2 text-xs">${e.speaker_name}</td>
            <td class="px-3 py-2 text-xs">${e.target_label}</td>
            <td class="px-3 py-2 text-xs text-slate-400">${e.source}</td>
            <td class="px-3 py-2 text-xs max-w-md truncate" title="${e.text.replace(/"/g, '&quot;')}">${e.text}</td>
            <td class="px-3 py-2 text-xs">${deliveryBadge(e.delivery_status)}</td>
            <td class="px-3 py-2 text-xs">
                <form method="post" action="/speakers/${e.speaker_id}/clear-logs"
                      data-confirm="¿Borrar todos los logs de ${e.speaker_name}? Esta acción no se puede deshacer."
                      data-confirm-variant="danger">
                    <button type="submit" class="text-slate-500 hover:text-red-400" title="Borrar logs de ${e.speaker_name}">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    </button>
                </form>
            </td>
        `;
        tbody.appendChild(tr);
    });
    if (rows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="px-3 py-6 text-center text-slate-500">Sin mensajes que coincidan con la búsqueda.</td></tr>`;
    }
    document.querySelectorAll(".sort-col").forEach(th => {
        const arrow = th.querySelector(".sort-arrow");
        arrow.innerHTML = th.dataset.col === sortState.col
            ? `<i data-lucide="${sortState.dir === "asc" ? "chevron-up" : "chevron-down"}" class="w-3 h-3 inline"></i>`
            : "";
    });
    lucide.createIcons();
}

document.querySelectorAll(".sort-col").forEach(th => {
    th.addEventListener("click", () => {
        const col = th.dataset.col;
        sortState = {col, dir: sortState.col === col && sortState.dir === "asc" ? "desc" : "asc"};
        render();
    });
});

document.getElementById("history-search").addEventListener("input", (e) => {
    query = e.target.value;
    render();
});

render();
</script>
{% endblock %}
