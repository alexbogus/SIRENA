{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}

<div class="flex flex-wrap items-center justify-between gap-3 mb-6 bg-navy-900 border border-navy-800 rounded-xl px-4 py-3">
    <div class="flex items-center gap-2">
        <span class="text-sm text-slate-400">Alertas automáticas:</span>
        <button id="auto-alerts-toggle"
                class="px-3 py-1 rounded-full text-sm font-medium {{ 'bg-emerald-900/60 text-emerald-300 border border-emerald-700' if auto_alerts_enabled else 'bg-amber-900/60 text-amber-300 border border-amber-700' }}"
                data-enabled="{{ 'true' if auto_alerts_enabled else 'false' }}">
            {{ 'ACTIVAS' if auto_alerts_enabled else 'PAUSADAS' }}
        </button>
    </div>
    <div id="health-indicator" class="flex items-center gap-4 text-sm text-slate-400"></div>
</div>

<div id="speaker-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

<template id="speaker-card-template">
    <div class="bg-navy-900 border border-navy-800 rounded-xl p-4 space-y-2">
        <div class="flex items-center justify-between gap-2">
            <span class="font-semibold flex items-center gap-2 min-w-0">
                <span class="dot w-2.5 h-2.5 rounded-full shrink-0"></span>
                <span class="name truncate"></span>
            </span>
            <div class="flex items-center gap-2 shrink-0">
                <span class="state text-xs px-2 py-0.5 rounded-full bg-navy-800"></span>
                <img class="model-img w-10 h-10 object-contain" src="{{ url_for('static', filename='images/speaker-model.png') }}" alt="Waveshare ESP32-S3-AUDIO-Board">
            </div>
        </div>
        <div class="text-xs text-slate-400 ip"></div>
        <div class="text-xs text-slate-400 fw"></div>
        <div class="text-xs text-slate-400">RSSI: <span class="rssi text-slate-200"></span></div>
        <div class="text-xs text-slate-400 flex items-center gap-2">
            <span class="shrink-0">Vol:</span>
            <input type="range" class="volume-slider flex-1" min="0" max="100" step="1">
            <span class="volume-value text-slate-200 w-10 text-right shrink-0"></span>
        </div>
        <div class="text-xs text-slate-400">Último msg altavoz: <span class="last-message-at text-slate-200"></span></div>
        <div class="text-xs text-slate-400">Último healthcheck: <span class="last-healthcheck-at text-slate-200"></span></div>
        <div class="text-xs text-slate-400">Uptime: <span class="uptime text-slate-200"></span></div>
        <div class="border-t border-navy-800 pt-2 text-xs">
            <div class="text-slate-400">Último mensaje enviado:</div>
            <div class="sent-text text-slate-200 truncate"></div>
            <div class="sent-status mt-1"></div>
        </div>
        <div class="border-t border-navy-800 pt-2">
            <div class="text-xs text-slate-400 mb-1">Histórico de mensajes</div>
            <div class="overflow-x-auto">
                <table class="history-table w-full text-xs">
                    <thead>
                        <tr class="text-slate-500 text-left">
                            <th class="sort-col cursor-pointer select-none pr-2 py-1" data-col="sent_at">Fecha <span class="sort-arrow"></span></th>
                            <th class="sort-col cursor-pointer select-none pr-2 py-1" data-col="target_label">Zona <span class="sort-arrow"></span></th>
                            <th class="sort-col cursor-pointer select-none py-1" data-col="text">Mensaje <span class="sort-arrow"></span></th>
                        </tr>
                    </thead>
                    <tbody class="history-body"></tbody>
                </table>
            </div>
        </div>
    </div>
</template>

{% endblock %}

{% block scripts %}
<script>
function fmtUptime(sec) {
    if (sec === null || sec === undefined) return "—";
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
    return `${h}h ${m}m`;
}

function deliveryBadge(status) {
    if (status === "confirmed") return `<span class="text-emerald-400">✓ confirmado</span>`;
    if (status === "unconfirmed") return `<span class="text-red-400">✗ no confirmado</span>`;
    return `<span class="text-slate-500">… verificando</span>`;
}

// Orden actual de la tabla de histórico por altavoz, sobrevive a los
// refrescos periódicos (que si no, resetearían el orden elegido cada 7s).
const historySortState = {}; // { [speakerId]: {col, dir} }

// Parser de "DD/MM/YYYY - HH:MM:ss" a valor comparable, para poder ordenar
// por fecha real y no alfabéticamente (que daría un orden erróneo).
function parseEsDate(s) {
    const m = /^(\d{2})\/(\d{2})\/(\d{4}) - (\d{2}):(\d{2}):(\d{2})$/.exec(s || "");
    if (!m) return 0;
    return new Date(m[3], m[2] - 1, m[1], m[4], m[5], m[6]).getTime();
}

function sortHistory(history, col, dir) {
    const sorted = [...history];
    sorted.sort((a, b) => {
        let av = a[col], bv = b[col];
        if (col === "sent_at") { av = parseEsDate(av); bv = parseEsDate(bv); }
        else { av = (av || "").toLowerCase(); bv = (bv || "").toLowerCase(); }
        if (av < bv) return dir === "asc" ? -1 : 1;
        if (av > bv) return dir === "asc" ? 1 : -1;
        return 0;
    });
    return sorted;
}

function renderHistoryTable(tbody, history) {
    tbody.innerHTML = "";
    history.forEach(h => {
        const tr = document.createElement("tr");
        tr.className = "border-t border-navy-800 text-slate-300";
        tr.innerHTML = `<td class="pr-2 py-1 whitespace-nowrap">${h.sent_at}</td>
                         <td class="pr-2 py-1">${h.target_label}</td>
                         <td class="py-1 truncate max-w-[200px]" title="${h.text.replace(/"/g, '&quot;')}">${h.text}</td>`;
        tbody.appendChild(tr);
    });
    if (history.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" class="py-2 text-navy-600">Sin mensajes todavía.</td></tr>`;
    }
}

// Altavoces cuyo slider de volumen se está arrastrando ahora mismo: el
// refresh periódico (7s) no debe pisar el valor mientras el usuario interactúa.
const draggingSpeakers = new Set();
const volumeDebounceTimers = {}; // { [speakerId]: timeoutId }

function renderSpeakers(speakers) {
    const grid = document.getElementById("speaker-grid");
    const tpl = document.getElementById("speaker-card-template");
    grid.innerHTML = "";
    speakers.forEach(sp => {
        const node = tpl.content.cloneNode(true);
        node.querySelector(".name").textContent = sp.name;
        node.querySelector(".ip").textContent = `IP ${sp.ip}`;
        node.querySelector(".fw").textContent = sp.firmware_version ? `fw ${sp.firmware_version}` : "fw —";
        node.querySelector(".rssi").textContent = sp.rssi_dbm !== null && sp.rssi_dbm !== undefined ? `${sp.rssi_dbm}dBm` : "—";

        const hasVolume = sp.volume_percent !== null && sp.volume_percent !== undefined;
        const slider = node.querySelector(".volume-slider");
        slider.dataset.speakerId = sp.id;
        if (!draggingSpeakers.has(String(sp.id))) {
            slider.value = hasVolume ? sp.volume_percent : 0;
        }
        node.querySelector(".volume-value").textContent = hasVolume ? `${sp.volume_percent}%` : "—";

        node.querySelector(".last-message-at").textContent = sp.last_message_at || "—";
        node.querySelector(".last-healthcheck-at").textContent = sp.last_healthcheck_at || "—";
        node.querySelector(".uptime").textContent = fmtUptime(sp.uptime_seconds);

        const dot = node.querySelector(".dot");
        const stateBadge = node.querySelector(".state");
        if (!sp.online) {
            dot.className = "dot w-2.5 h-2.5 rounded-full bg-navy-600";
            stateBadge.textContent = "offline";
            stateBadge.className = "state text-xs px-2 py-0.5 rounded-full bg-navy-800 text-slate-500";
        } else if (sp.state === "streaming") {
            dot.className = "dot w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse";
            stateBadge.textContent = "streaming";
            stateBadge.className = "state text-xs px-2 py-0.5 rounded-full bg-emerald-900/60 text-emerald-300";
        } else {
            dot.className = "dot w-2.5 h-2.5 rounded-full bg-sky-400";
            stateBadge.textContent = "idle";
            stateBadge.className = "state text-xs px-2 py-0.5 rounded-full bg-navy-800 text-slate-300";
        }

        if (sp.last_sent_message) {
            node.querySelector(".sent-text").textContent = sp.last_sent_message.text;
            node.querySelector(".sent-status").innerHTML = deliveryBadge(sp.last_sent_message.delivery_status);
        } else {
            node.querySelector(".sent-text").textContent = "—";
        }

        const state = historySortState[sp.id] || {col: "sent_at", dir: "desc"};
        const tbody = node.querySelector(".history-body");
        renderHistoryTable(tbody, sortHistory(sp.history || [], state.col, state.dir));
        node.querySelectorAll(".sort-col").forEach(th => {
            th.dataset.speakerId = sp.id;
            if (th.dataset.col === state.col) {
                th.querySelector(".sort-arrow").textContent = state.dir === "asc" ? "▲" : "▼";
            }
        });
        grid.appendChild(node);
    });
}

document.getElementById("speaker-grid").addEventListener("click", (e) => {
    const th = e.target.closest(".sort-col");
    if (!th) return;
    const speakerId = th.dataset.speakerId;
    const col = th.dataset.col;
    const current = historySortState[speakerId] || {col: "sent_at", dir: "desc"};
    const dir = current.col === col && current.dir === "asc" ? "desc" : "asc";
    historySortState[speakerId] = {col, dir};
    refresh();
});

async function applyVolume(speakerId, value) {
    try {
        await fetch(`/speakers/${speakerId}/volume`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({volume_percent: value}),
        });
    } catch (e) {
        console.error("Fallo al aplicar el volumen", e);
    }
}

const speakerGrid = document.getElementById("speaker-grid");

speakerGrid.addEventListener("input", (e) => {
    const slider = e.target.closest(".volume-slider");
    if (!slider) return;
    const speakerId = slider.dataset.speakerId;
    const value = Number(slider.value);
    slider.closest(".space-y-2").querySelector(".volume-value").textContent = `${value}%`;

    clearTimeout(volumeDebounceTimers[speakerId]);
    volumeDebounceTimers[speakerId] = setTimeout(() => applyVolume(speakerId, value), 500);
});

speakerGrid.addEventListener("pointerdown", (e) => {
    const slider = e.target.closest(".volume-slider");
    if (slider) draggingSpeakers.add(slider.dataset.speakerId);
});

["pointerup", "pointercancel"].forEach(evt => {
    speakerGrid.addEventListener(evt, (e) => {
        const slider = e.target.closest(".volume-slider");
        if (slider) draggingSpeakers.delete(slider.dataset.speakerId);
    });
});

function renderHealth(health) {
    const el = document.getElementById("health-indicator");
    const parts = [];
    for (const [key, label] of [["cv112_feed", "Feed 112CV"], ["piper", "Piper"]]) {
        const h = health[key];
        if (!h) continue;
        if (h.ok) {
            parts.push(`<span class="text-emerald-400">${label}: OK</span>`);
        } else {
            parts.push(`<span class="text-red-400">⚠ ${label}: fallando (${h.consecutive_failures} intentos)</span>`);
        }
    }
    el.innerHTML = parts.join(" · ");
}

async function refresh() {
    try {
        const resp = await fetch("{{ url_for('dashboard.api_speakers_status') }}");
        const data = await resp.json();
        renderSpeakers(data.speakers);
        renderHealth(data.health);
    } catch (e) {
        console.error("Fallo al refrescar el dashboard", e);
    }
}

document.getElementById("auto-alerts-toggle").addEventListener("click", async (e) => {
    const resp = await fetch("{{ url_for('dashboard.toggle_auto_alerts') }}", {method: "POST"});
    const data = await resp.json();
    location.reload();
});

refresh();
setInterval(refresh, 7000);
</script>
{% endblock %}
